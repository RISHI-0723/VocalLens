[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocallens"
version = "0.1.0"
description = "Evidence-grounded contrastive speech-delivery analysis (prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy<2",
  "scipy",
  "librosa>=0.10",
  "soundfile",
  "PyYAML",
  "pydantic>=2",
  "plotly>=5",
  "pronouncing",
  "pandas",
  "streamlit>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
