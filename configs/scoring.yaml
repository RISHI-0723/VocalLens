# VocalLens scoring configuration.
# Canonical starter block from ARCHITECTURE.md §8.9. PROVISIONAL and UNVALIDATED:
# this is a prototype rubric transform, NOT a validated psychometric score.
# Do not tune these anchors on held-out evaluation cases (CLAUDE.md §9 / §5.9).
schema_version: 1
score_scale:
  minimum: 0.0
  maximum: 100.0
dimensions:
  pace:
    weight: 0.30
    transform: "piecewise_linear"
    input: "aggregate_normalized_exceedance"
    anchors:
      - { exceedance: 0.0, score: 100.0 }
      - { exceedance: 1.0, score: 70.0 }
      - { exceedance: 3.0, score: 0.0 }
  pause_management:
    weight: 0.30
    transform: "piecewise_linear"
    input: "aggregate_normalized_exceedance"
    anchors:
      - { exceedance: 0.0, score: 100.0 }
      - { exceedance: 1.0, score: 70.0 }
      - { exceedance: 3.0, score: 0.0 }
  vocal_variation:
    weight: 0.20
    transform: "piecewise_linear"
    input: "aggregate_normalized_exceedance"
    anchors:
      - { exceedance: 0.0, score: 100.0 }
      - { exceedance: 1.0, score: 70.0 }
      - { exceedance: 3.0, score: 0.0 }
  energy_control:
    weight: 0.20
    transform: "piecewise_linear"
    input: "aggregate_normalized_exceedance"
    anchors:
      - { exceedance: 0.0, score: 100.0 }
      - { exceedance: 1.0, score: 70.0 }
      - { exceedance: 3.0, score: 0.0 }
aggregation:
  dimension_exceedance: "median_valid_rule_exceedance"
  clamp_exceedance_min: 0.0
  missing_rule_policy: "exclude"
  min_valid_rules_per_dimension: 1
  overall_min_valid_dimensions: 3
  renormalize_weights_over_valid_dimensions: true
  round_display_decimals: 0
